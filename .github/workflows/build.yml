name: Deploy Backend

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH client with Bastion
        env:
          BASTION_KEY: ${{ secrets.BASTION_KEY }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$BASTION_KEY" > ~/.ssh/bastion.pem
          echo "$SERVER_KEY" > ~/.ssh/server.pem
          chmod 600 ~/.ssh/bastion.pem ~/.ssh/server.pem
          cat <<EOF > ~/.ssh/config
          Host bastion-host
            HostName ${{ secrets.BASTION_HOST }}
            User ${{ secrets.BASTION_USER }}
            IdentityFile ~/.ssh/bastion.pem
            StrictHostKeyChecking no

          Host private-server
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/server.pem
            ProxyJump bastion-host
            StrictHostKeyChecking no
          EOF

      - name: Deploy on server
        run: |
          ssh private-server "
            cd /home/ec2-user/app &&
            git pull origin deploy &&
            echo 'PORT=${{ secrets.PORT }}' > .env &&
            echo 'DB_HOST=${{ secrets.DB_HOST }}' >> .env &&
            echo 'DB_PORT=${{ secrets.DB_PORT }}' >> .env &&
            echo 'DB_USER=${{ secrets.DB_USER }}' >> .env &&
            echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env &&
            echo 'DB_NAME=${{ secrets.DB_NAME }}' >> .env &&
            docker-compose down &&
            docker-compose up -d --build
          "
